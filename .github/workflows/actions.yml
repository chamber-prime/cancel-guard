name: cancel-probe

# Run it, let it get a minute or two in, then hit Cancel and read the log.
# Everything here is local -- no cloud credentials needed.

on:
  workflow_dispatch:
    inputs:
      stage_seconds:
        description: seconds per stage (5 stages)
        default: "60"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false      # the wrapper intercepts signals; we want raw terraform

      - name: Mark start
        working-directory: ${{ steps.locate.outputs.dir }}
        run: echo "JOB START $(date -uIseconds)"

      - name: Init
        working-directory: ${{ steps.locate.outputs.dir }}
        run: terraform init -no-color

      # The step under observation. Watch the heartbeats, then press Cancel.
      - name: Apply
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "APPLY INVOKED $(date -uIseconds)  pid=$$"
          terraform apply -auto-approve -no-color \
            -var stage_seconds=${{ inputs.stage_seconds || '60' }}

      # --- the measurements -------------------------------------------------
      # Compare these timestamps against the last heartbeat in the Apply step.
      # The gap is your real grace period, and it decides whether a graceful
      # shutdown wrapper can do anything useful at all.

      - name: Ran because CANCELLED
        if: cancelled()
        run: |
          echo "CANCELLED-BRANCH REACHED $(date -uIseconds)"
          echo "How long does this get before the runner pulls the plug?"
          for i in $(seq 1 30); do
            echo "[$(date -uIseconds)] post-cancel step still alive, ${i}s"
            sleep 1
          done
          echo "POST-CANCEL STEP COMPLETED 30s $(date -uIseconds)"

      - name: Ran because FAILED
        if: failure()
        run: echo "FAILURE-BRANCH REACHED $(date -uIseconds)"

      - name: Always runs
        if: always()
        run: echo "ALWAYS-BRANCH REACHED $(date -uIseconds) status=${{ job.status }}"