name: cancel-probe

# Run it, let it get a minute or two in, then hit Cancel and read the log.
# State now lives remotely (Azure Blob, OIDC auth, see the backend block in
# main.tf), so the Plan step below exercises real state locking, not just
# local resources.

on:
  workflow_dispatch:
    inputs:
      stage_seconds:
        description: seconds per stage (5 stages)
        default: "60"

# Only one run per branch at a time. A second dispatch cancels whatever's
# still running instead of racing it -- two live `terraform apply`s against
# the same state would just fight over the lock. Cancelling (rather than
# letting the new run fail outright) is deliberate: it drives the old run
# through the cancelled() cleanup path below (rollback-auto breaks the lease
# and rolls back state) instead of leaving it to die mid-apply unattended.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write   # required for the OIDC federated credential exchange
  actions: read     # lets the stale-run check list past workflow runs

env:
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: true
  # Same storage account/container/key as the backend block in main.tf --
  # used below by the az CLI to break the stale lease and roll back state.
  TFSTATE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
  TFSTATE_CONTAINER: tfstate
  TFSTATE_KEY: cancel-guard.tfstate
  TF_STATUS: "NOT STARTED"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tf_status: ${{ steps.export_status.outputs.tf_status }}
    steps:
      # Runs are workflow_dispatch and get re-triggered a lot while testing
      # cancellation, so they don't always finish in commit order. If a
      # newer commit already succeeded, flag it now -- before Apply even
      # starts -- so a later failure on this (older) commit doesn't get
      # misread as a regression.
      - name: Check for a newer already-succeeded run
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u

          commit_epoch() {
            local date_str
            date_str=$(gh api "repos/${{ github.repository }}/commits/$1" --jq '.commit.committer.date' 2>/dev/null) || return 1
            [ -z "$date_str" ] && return 1
            date -d "$date_str" +%s
          }

          CURRENT_SHA="${{ github.sha }}"
          CURRENT_EPOCH=$(commit_epoch "$CURRENT_SHA") || {
            echo "Couldn't resolve this commit's date -- skipping the check."
            exit 0
          }

          CANDIDATES=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow=actions.yml \
            --branch "${{ github.ref_name }}" \
            --status success \
            --limit 10 \
            --json headSha,databaseId,url \
            --jq '.[] | @base64') || CANDIDATES=""

          for row in $CANDIDATES; do
            CAND_SHA=$(echo "$row" | base64 --decode | jq -r '.headSha')
            [ "$CAND_SHA" = "$CURRENT_SHA" ] && continue

            CAND_EPOCH=$(commit_epoch "$CAND_SHA") || continue
            if [ "$CAND_EPOCH" -gt "$CURRENT_EPOCH" ]; then
              CAND_ID=$(echo "$row" | base64 --decode | jq -r '.databaseId')
              CAND_URL=$(echo "$row" | base64 --decode | jq -r '.url')

              echo "::warning::Commit $CAND_SHA already succeeded (run $CAND_URL) and is newer than this run's commit $CURRENT_SHA. If this run fails, it may be a stale/out-of-order result, not a regression."

              {
                echo "### Possibly stale run"
                echo "This run is building an older commit (\`$CURRENT_SHA\`)."
                echo "A newer commit \`$CAND_SHA\` already succeeded in [run #$CAND_ID]($CAND_URL)."
                echo ""
                echo "If this run fails, check whether \`$CAND_SHA\` already fixes it before treating this as a regression."
              } >> "$GITHUB_STEP_SUMMARY"

              exit 0
            fi
          done

          echo "No newer successful run found on this branch."

      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false      # the wrapper intercepts signals; we want raw terraform

      - name: Mark start
        working-directory: ${{ steps.locate.outputs.dir }}
        run: echo "JOB START $(date -uIseconds)"

      - name: Init
        working-directory: ${{ steps.locate.outputs.dir }}
        run: terraform init -no-color

      # Acquires the remote state lock, reads current state, computes a diff,
      # releases the lock. This is the stage that exercises locking -- if you
      # cancel here (rather than during Apply), check the storage account for
      # a leftover lease / .tflock blob afterwards.
      - name: Plan
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "PLAN INVOKED $(date -uIseconds)  pid=$$"
          terraform plan -no-color -input=false \
            -var stage_seconds=${{ inputs.stage_seconds || '60' }}

      - name: Mark status RUNNING
        run: echo "TF_STATUS=RUNNING" >> "$GITHUB_ENV"

      # The step under observation. Watch the heartbeats, then press Cancel.
      - name: Apply
        working-directory: ${{ steps.locate.outputs.dir }}
        run: |
          echo "APPLY INVOKED $(date -uIseconds)  pid=$$"
          terraform apply -auto-approve -no-color \
            -var stage_seconds=${{ inputs.stage_seconds || '60' }}

      - name: Mark status SUCCESS
        if: success()
        run: echo "TF_STATUS=SUCCESS" >> "$GITHUB_ENV"

      - name: Mark status FAILED
        if: failure()
        run: echo "TF_STATUS=FAILED" >> "$GITHUB_ENV"

      - name: Mark status CANCELLED
        if: cancelled()
        run: echo "TF_STATUS=CANCELLED" >> "$GITHUB_ENV"

      - name: Deploy
        working-directory: ${{ steps.locate.outputs.dir }}
        run: sleep 30

      # --- the measurements -------------------------------------------------
      # Compare these timestamps against the last heartbeat in the Apply step.
      # The gap is your real grace period, and it decides whether a graceful
      # shutdown wrapper can do anything useful at all.

      - name: Ran because CANCELLED
        if: cancelled()
        run: |
          echo "CANCELLED-BRANCH REACHED $(date -uIseconds)"
          echo "How long does this get before the runner pulls the plug?"
          for i in $(seq 1 30); do
            echo "[$(date -uIseconds)] post-cancel step still alive, ${i}s"
            sleep 1
          done
          echo "POST-CANCEL STEP COMPLETED 30s $(date -uIseconds)"

      # Rollback itself now happens in dedicated jobs below (rollback-auto /
      # rollback-gate), keyed off tf_status so a SUCCESSFUL apply followed by
      # a later cancel/failure (e.g. in Deploy) goes through manual approval
      # instead of being auto-rolled-back.

      - name: Ran because FAILED
        if: failure()
        run: echo "FAILURE-BRANCH REACHED $(date -uIseconds)"

      - name: Always runs
        if: always()
        run: echo "ALWAYS-BRANCH REACHED $(date -uIseconds) status=${{ job.status }}"

      - name: Export status
        if: always()
        id: export_status
        run: echo "tf_status=$TF_STATUS" >> "$GITHUB_OUTPUT"

  # Apply itself was interrupted (state never reached SUCCESS) -- no
  # ambiguity about whether the new resources are wanted, so roll back
  # automatically. Also covers TF_STATUS=FAILED regardless of which step
  # failed.
  rollback-auto:
    needs: build
    if: |
      always() &&
      (needs.build.outputs.tf_status == 'FAILED' ||
       (needs.build.result == 'cancelled' && needs.build.outputs.tf_status != 'SUCCESS'))
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Break stale state lock
        run: |
          az storage blob lease break \
            --account-name "$TFSTATE_ACCOUNT" \
            --container-name "$TFSTATE_CONTAINER" \
            --blob-name "$TFSTATE_KEY" \
            --auth-mode login \
            --output none \
          && echo "lease broken" \
          || echo "no lease held, nothing to break"

      # A cancelled/failed Apply can die mid-write, leaving a partially
      # updated state blob. Blob versioning (enabled on the storage account
      # in main.tf) keeps every prior write, so roll the live blob back to
      # the version that existed before this run touched it.
      - name: Roll back state to previous version
        run: |
          set -u

          # Every past write is a version with isCurrentVersion=false; the
          # live blob itself isn't in this list. Newest-first, take the top.
          PREV_VERSION=$(az storage blob list \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --prefix "$TFSTATE_KEY" --include v --auth-mode login \
            --query "reverse(sort_by([?name=='$TFSTATE_KEY' && isCurrentVersion!=\`true\`], &versionId))[0].versionId" \
            -o tsv)

          if [ -z "$PREV_VERSION" ] || [ "$PREV_VERSION" = "None" ]; then
            echo "No earlier version found -- nothing to roll back to."
            exit 0
          fi

          echo "rolling back to version:  $PREV_VERSION"

          TMP=$(mktemp)
          az storage blob download \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --name "$TFSTATE_KEY" --version-id "$PREV_VERSION" \
            --auth-mode login --file "$TMP" --output none

          az storage blob upload \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --name "$TFSTATE_KEY" --file "$TMP" \
            --auth-mode login --overwrite --output none

          echo "state rolled back to version $PREV_VERSION"

  # Apply itself SUCCEEDED, but the run then failed or was cancelled later
  # (e.g. in Deploy). The new state is legitimate, so don't roll it back
  # automatically -- pause here for a human to decide. Configure required
  # reviewers on the "rollback-approval" environment in repo Settings ->
  # Environments to make this pause enforce an actual approval.
  rollback-gate:
    needs: build
    if: |
      always() &&
      needs.build.outputs.tf_status == 'SUCCESS' &&
      needs.build.result != 'success'
    runs-on: ubuntu-latest
    environment: rollback-approval
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Break stale state lock
        run: |
          az storage blob lease break \
            --account-name "$TFSTATE_ACCOUNT" \
            --container-name "$TFSTATE_CONTAINER" \
            --blob-name "$TFSTATE_KEY" \
            --auth-mode login \
            --output none \
          && echo "lease broken" \
          || echo "no lease held, nothing to break"

      - name: Roll back state to previous version
        run: |
          set -u

          PREV_VERSION=$(az storage blob list \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --prefix "$TFSTATE_KEY" --include v --auth-mode login \
            --query "reverse(sort_by([?name=='$TFSTATE_KEY' && isCurrentVersion!=\`true\`], &versionId))[0].versionId" \
            -o tsv)

          if [ -z "$PREV_VERSION" ] || [ "$PREV_VERSION" = "None" ]; then
            echo "No earlier version found -- nothing to roll back to."
            exit 0
          fi

          echo "rolling back to version:  $PREV_VERSION"

          TMP=$(mktemp)
          az storage blob download \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --name "$TFSTATE_KEY" --version-id "$PREV_VERSION" \
            --auth-mode login --file "$TMP" --output none

          az storage blob upload \
            --account-name "$TFSTATE_ACCOUNT" --container-name "$TFSTATE_CONTAINER" \
            --name "$TFSTATE_KEY" --file "$TMP" \
            --auth-mode login --overwrite --output none

          echo "state rolled back to version $PREV_VERSION"